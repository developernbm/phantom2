
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHANTOM2</title>

<style>
:root {
  --red: #ff183d;
  --deep-red: #8c001d;
  --muted: #a78c95;
  --bg: #050306;
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  color: white;
  background:
    radial-gradient(ellipse at 75% 48%, #240711 0%, transparent 48%),
    var(--bg);
  font-family: "Segoe UI", Arial, sans-serif;
}

#space {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  display: block;
}

.background-grid {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: .12;
  background-image:
    linear-gradient(rgba(255,24,61,.2) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,24,61,.2) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: linear-gradient(to bottom, black, transparent 90%);
}

.topbar, .footer {
  position: fixed;
  z-index: 3;
  left: 5%;
  right: 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  color: #a78c95;
  font-size: 10px;
  letter-spacing: 2px;
}

.topbar { top: 24px; }
.footer { bottom: 23px; color: #75505c; font-size: 9px; }

.status {
  display: flex;
  align-items: center;
  gap: 9px;
}

.dot {
  width: 7px;
  height: 7px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 12px var(--red);
  animation: blink 1s steps(2) infinite;
}

.red { color: var(--red); }

/* Typing elements retain the original layout. */
.type-text {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

main {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  width: min(600px, 53vw);
  min-height: 100vh;
  margin-left: 8%;
  padding: 90px 0 85px;
}

.eyebrow {
  margin-bottom: 24px;
  color: var(--red);
  font-size: 10px;
  letter-spacing: 4px;
}

h1 {
  position: relative;
  margin: 0;
  font-size: clamp(54px, 7.4vw, 104px);
  line-height: 1.08;
  letter-spacing: -.055em;
  font-weight: 950;
  white-space: nowrap;
  text-transform: uppercase;
  color: #ff274a;
  background: linear-gradient(
    180deg,
    #fff0f3 0%,
    #ff6b82 16%,
    #ff183d 43%,
    #c0002c 68%,
    #510013 100%
  );
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter:
    drop-shadow(0 2px 0 #92001d)
    drop-shadow(0 5px 0 #500010)
    drop-shadow(0 12px 18px rgba(255,0,45,.32));
  transform: perspective(600px) rotateX(8deg);
  transform-origin: bottom;
  animation: titleIn .9s ease-out both;
}

.rule {
  width: 88px;
  height: 3px;
  flex-shrink: 0;
  margin: 22px 0;
  background: var(--red);
  box-shadow: 0 0 16px rgba(255,24,61,.7);
}

.typing-area {
  width: 100%;
  min-height: 112px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  color: #ff4562;
  font-size: clamp(11px, 1.15vw, 14px);
  line-height: 1.65;
  letter-spacing: 2px;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}

.type-line {
  display: block;
  min-height: 23px;
  width: 100%;
  opacity: 0;
  transform: translateY(-16px);
  transition: opacity .35s ease, transform .35s ease;
}

.type-line.visible {
  opacity: 1;
  transform: translateY(0);
}

.cursor {
  display: inline-block;
  width: 7px;
  height: 14px;
  margin-left: 3px;
  vertical-align: -2px;
  background: var(--red);
  box-shadow: 0 0 10px var(--red);
  animation: blink .7s steps(2) infinite;
}

.description {
  max-width: 420px;
  margin: 16px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.9;
  letter-spacing: .5px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 17px;
  margin-top: 28px;
}

.btn {
  position: relative;
  min-height: 49px;
  padding: 14px 19px;
  border: 1px solid #ff536d;
  border-radius: 3px;
  background: linear-gradient(180deg, #ff3657, #bd002b 65%, #710019);
  color: white;
  font: 800 10px "Segoe UI", Arial, sans-serif;
  letter-spacing: 1.4px;
  cursor: pointer;
  transform: perspective(500px) rotateX(5deg);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -3px 0 rgba(0,0,0,.28),
    0 5px 0 #510012,
    0 10px 20px rgba(255,0,45,.17);
  transition: transform .18s, box-shadow .18s, filter .18s;
}

.btn.secondary {
  color: #ff748a;
  background: linear-gradient(180deg, #291019, #10070c);
  border-color: #762137;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 5px 0 #30000b,
    0 10px 20px rgba(0,0,0,.3);
}

.btn:hover {
  transform: perspective(500px) rotateX(0) translateY(-3px);
  filter: brightness(1.15);
  box-shadow: 0 8px 0 #510012, 0 15px 25px rgba(255,0,45,.22);
}

.btn:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #510012;
}

@keyframes blink {
  50% { opacity: 0; }
}

@keyframes titleIn {
  from {
    opacity: 0;
    transform: perspective(600px) rotateX(-35deg) translateY(-25px);
  }
  to {
    opacity: 1;
    transform: perspective(600px) rotateX(8deg) translateY(0);
  }
}

@media (max-width: 800px) {
  main {
    width: 86%;
    margin-left: 7%;
    padding-top: 85px;
    padding-bottom: 80px;
  }

  #space { opacity: .62; }

  h1 {
    font-size: clamp(48px, 12vw, 82px);
    letter-spacing: -.06em;
  }

  .typing-area { font-size: 11px; }
  .topbar, .footer { font-size: 8px; letter-spacing: 1px; }
}

@media (max-height: 650px) {
  main {
    padding-top: 65px;
    padding-bottom: 55px;
  }

  .eyebrow { margin-bottom: 12px; }
  .rule { margin: 13px 0; }
  .typing-area { min-height: 88px; gap: 4px; }
  .description { margin-top: 8px; }
  .actions { margin-top: 15px; }
  .btn { min-height: 42px; padding: 11px 15px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<canvas id="space"></canvas>
<div class="background-grid"></div>

<header class="topbar">
  <div class="status">
    <span class="dot"></span>
    <span class="type-text" id="brandText"></span>
  </div>
  <div class="type-text" id="coreText"></div>
</header>

<main>
  <div class="eyebrow type-text" id="eyebrowText"></div>

  <h1 id="titleText"></h1>

  <div class="rule"></div>

  <section class="typing-area" aria-live="polite">
    <div class="type-line" id="line1"></div>
    <div class="type-line" id="line2"></div>
    <div class="type-line" id="line3"></div>
  </section>

  <p class="description type-text" id="descriptionText"></p>

  <div class="actions">
    <button class="btn" id="startBtn" type="button">
      &#9654; &nbsp; ENTER PHANTOM2
    </button>

    <button class="btn secondary" id="docsBtn" type="button">
      &#8599; &nbsp; DOCUMENTATION
    </button>
  </div>
</main>

<footer class="footer">
  <div>
    <span class="type-text" id="footerBrand"></span>
    <span class="red"> /// </span>
    <span class="type-text" id="footerLabel"></span>
  </div>
  <div>
    <span class="type-text" id="footerBuild"></span>
    <span class="red"> /// </span>
    <span class="type-text" id="footerReady"></span>
  </div>
</footer>

<script>
/*
 * One global queue types every requested text element.
 * Adjust LETTER_DELAY to change the speed.
 */
const LETTER_DELAY = 95;
const SPACE_DELAY = 150;
const LINE_DELAY = 320;

const typingSequence = [
  { id: "brandText", text: "PHANTOM SYSTEMS" },
  { id: "coreText", text: "CORE INTERFACE // V2.0" },
  { id: "eyebrowText", text: "SYSTEM INITIALIZATION / 001" },
  { id: "titleText", text: "PHANTOM2" },
  { id: "line1", text: "REMOTE ADMINISTRATION FRAMEWORK" },
  { id: "line2", text: "SYSTEM INTERFACE ONLINE" },
  { id: "line3", text: "AUTHORIZED ENVIRONMENTS ONLY" },
  {
    id: "descriptionText",
    text: "A precision-built digital environment. Explore the interface and access technical resources."
  },
  { id: "footerBrand", text: "PHANTOM2" },
  { id: "footerLabel", text: "DIGITAL INTERFACE" },
  { id: "footerBuild", text: "BUILD 02.0" },
  { id: "footerReady", text: "READY" }
];

const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

async function typeElement(item) {
  const element = document.getElementById(item.id);
  if (!element) return;

  element.classList.add("visible");

  const cursor = document.createElement("span");
  cursor.className = "cursor";
  element.appendChild(cursor);

  for (const character of item.text) {
    cursor.before(document.createTextNode(character));

    const delay = character === " "
      ? SPACE_DELAY
      : LETTER_DELAY;

    await wait(delay);
  }

  cursor.remove();
  await wait(LINE_DELAY);
}

async function runAllTyping() {
  for (const item of typingSequence) {
    await typeElement(item);
  }
}

runAllTyping();

/* Existing Electron navigation methods remain unchanged. */
document.getElementById("startBtn").addEventListener("click", () => {
  if (typeof window.api?.welcomeStart === "function") {
    window.api.welcomeStart();
  } else {
    console.warn("Connect welcomeStart() to your existing application navigation.");
  }
});

document.getElementById("docsBtn").addEventListener("click", () => {
  if (typeof window.api?.welcomeLearn === "function") {
    window.api.welcomeLearn();
  } else {
    console.warn("Connect welcomeLearn() to your existing documentation page.");
  }
});
</script>

<script type="module">
import * as THREE from
  "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const canvas = document.getElementById("space");

let renderer;

try {
  renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: true
  });
} catch (error) {
  console.error("WebGL initialization failed:", error);
}

if (renderer) {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    38,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );

  camera.position.z = 10;

  scene.add(new THREE.AmbientLight(0xffffff, 1.25));

  const redLight = new THREE.PointLight(0xff183d, 35, 30);
  redLight.position.set(3, 2, 5);
  scene.add(redLight);

  const sunLight = new THREE.DirectionalLight(0xffffff, 3);
  sunLight.position.set(-4, 5, 8);
  scene.add(sunLight);

  const system = new THREE.Group();
  scene.add(system);

  const textureLoader = new THREE.TextureLoader();
  textureLoader.setCrossOrigin("anonymous");

  function makeSphere({
    radius,
    position,
    texture,
    color = 0xffffff,
    roughness = 1
  }) {
    const geometry = new THREE.SphereGeometry(radius, 96, 64);

    const material = new THREE.MeshStandardMaterial({
      color,
      map: texture || null,
      roughness,
      metalness: 0
    });

    const sphere = new THREE.Mesh(geometry, material);
    sphere.position.set(...position);
    system.add(sphere);

    return sphere;
  }

  function loadTexture(url) {
    return textureLoader.load(
      url,
      texture => {
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      },
      undefined,
      error => console.error("Planet texture failed to load:", url, error)
    );
  }

  const earthMap = loadTexture(
    "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
  );

  const earthClouds = loadTexture(
    "https://threejs.org/examples/textures/planets/earth_clouds_1024.png"
  );

  const moonMap = loadTexture(
    "https://threejs.org/examples/textures/planets/moon_1024.jpg"
  );

  const marsMap = loadTexture(
    "https://threejs.org/examples/textures/planets/mars_1k_color.jpg"
  );

  const earth = makeSphere({
    radius: 2.05,
    position: [2.65, 0.05, 0],
    texture: earthMap
  });

  earth.rotation.z = THREE.MathUtils.degToRad(23.4);

  const atmosphere = new THREE.Mesh(
    new THREE.SphereGeometry(2.12, 96, 64),
    new THREE.MeshBasicMaterial({
      color: 0xff173d,
      transparent: true,
      opacity: 0.12,
      side: THREE.BackSide
    })
  );

  atmosphere.position.copy(earth.position);
  system.add(atmosphere);

  const clouds = new THREE.Mesh(
    new THREE.SphereGeometry(2.075, 96, 64),
    new THREE.MeshStandardMaterial({
      map: earthClouds,
      transparent: true,
      opacity: 0.22,
      depthWrite: false
    })
  );

  clouds.position.copy(earth.position);
  system.add(clouds);

  const moon = makeSphere({
    radius: 0.43,
    position: [-1.05, 1.45, 0.4],
    texture: moonMap
  });

  const mars = makeSphere({
    radius: 0.57,
    position: [4.9, -2.0, -0.5],
    texture: marsMap
  });

  const saturn = makeSphere({
    radius: 0.46,
    position: [5.2, 2.25, -1.2],
    color: 0xc89c70
  });

  const saturnRing = new THREE.Mesh(
    new THREE.RingGeometry(0.62, 1.02, 96),
    new THREE.MeshStandardMaterial({
      color: 0xd5a477,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.8,
      roughness: 1
    })
  );

  saturnRing.position.copy(saturn.position);
  saturnRing.rotation.x = Math.PI / 2.7;
  saturnRing.rotation.y = 0.2;
  system.add(saturnRing);

  function makeOrbit(radiusX, radiusY, rotation, opacity) {
    const points = [];

    for (let i = 0; i <= 240; i++) {
      const angle = (i / 240) * Math.PI * 2;

      points.push(new THREE.Vector3(
        Math.cos(angle) * radiusX,
        Math.sin(angle) * radiusY,
        -0.7
      ));
    }

    const geometry = new THREE.BufferGeometry().setFromPoints(points);

    const line = new THREE.LineLoop(
      geometry,
      new THREE.LineBasicMaterial({
        color: 0xff2347,
        transparent: true,
        opacity
      })
    );

    line.position.set(2.4, 0, -0.5);
    line.rotation.z = rotation;
    system.add(line);
  }

  makeOrbit(3.05, 1.65, -0.38, 0.36);
  makeOrbit(3.55, 2.15, 0.45, 0.2);
  makeOrbit(2.9, 2.45, 1.0, 0.14);

  const starCount = 1100;
  const starPositions = new Float32Array(starCount * 3);

  for (let i = 0; i < starCount; i++) {
    starPositions[i * 3] = (Math.random() - 0.5) * 24;
    starPositions[i * 3 + 1] = (Math.random() - 0.5) * 14;
    starPositions[i * 3 + 2] = -2 - Math.random() * 12;
  }

  const starGeometry = new THREE.BufferGeometry();

  starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(starPositions, 3)
  );

  const stars = new THREE.Points(
    starGeometry,
    new THREE.PointsMaterial({
      color: 0xff8da2,
      size: 0.018,
      transparent: true,
      opacity: 0.8
    })
  );

  scene.add(stars);

  function resize() {
    const width = window.innerWidth;
    const height = window.innerHeight;

    renderer.setSize(width, height);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    if (width < 800) {
      system.scale.setScalar(0.72);
      system.position.x = 0.6;
    } else {
      system.scale.setScalar(1);
      system.position.x = 0;
    }
  }

  window.addEventListener("resize", resize);
  resize();

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const time = clock.getElapsedTime();

    earth.rotation.y += 0.0017;
    clouds.rotation.y += 0.0019;
    moon.rotation.y += 0.001;
    mars.rotation.y += 0.0015;
    saturn.rotation.y += 0.001;
    saturnRing.rotation.z += 0.0006;

    system.position.y = Math.sin(time * 0.35) * 0.06;
    stars.rotation.z = Math.sin(time * 0.03) * 0.012;

    renderer.render(scene, camera);
  }

  animate();
}
</script>
</body>
</html>
